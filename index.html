
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Face Tracking - OAKKY67</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .a-canvas {
      background: transparent !important;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-face="faceOccluder: false"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="alpha: true; colorManagement: true">

    <a-entity
      id="face"
      mindar-face-default-face-occluder>
    </a-entity>

    <a-camera
      active="false"
      position="0 0 0">
    </a-camera>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");

    scene.addEventListener("arReady", () => {
      const THREE = AFRAME.THREE;
      const image = new Image();

      image.crossOrigin = "anonymous";
      image.src = "https://oakky67.github.io/face.png";

      image.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;

        const ctx = canvas.getContext("2d", {
          willReadFrequently: true
        });

        ctx.drawImage(image, 0, 0);

        const pixels = ctx.getImageData(
          0, 0, canvas.width, canvas.height
        );

        // ทำพื้นหลังดำให้โปร่งใส
        for (let i = 0; i < pixels.data.length; i += 4) {
          const r = pixels.data[i];
          const g = pixels.data[i + 1];
          const b = pixels.data[i + 2];

          if (Math.max(r, g, b) < 40) {
            pixels.data[i + 3] = 0;
          }
        }

        ctx.putImageData(pixels, 0, 0);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.needsUpdate = true;

        const face = document.querySelector("#face");
        const mesh = face.getObject3D("mesh");

        if (!mesh) {
          console.error("ไม่พบ Face Mesh");
          return;
        }

        const oldMaterial = mesh.material;

        mesh.material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 1,
          side: THREE.DoubleSide,
          depthWrite: false
        });

        if (oldMaterial) {
          if (Array.isArray(oldMaterial)) {
            oldMaterial.forEach(m => m.dispose());
          } else {
            oldMaterial.dispose();
          }
        }

        mesh.frustumCulled = false;
        console.log("Face Texture loaded");
      };

      image.onerror = () => {
        console.error("โหลด face.png ไม่สำเร็จ");
      };
    });
  </script>
</body>
</html>
