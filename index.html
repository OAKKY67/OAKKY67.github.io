
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Infographic</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    #start {
      position: fixed;
      z-index: 10;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 28px;
      background: orange;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      position: fixed;
      z-index: 9;
      top: 10px;
      left: 10px;
      right: 10px;
      text-align: center;
      color: white;
      background: #10243dcc;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div id="status">กดเริ่ม แล้วสแกนรูป Target</div>
  <button id="start">เริ่มสแกน AR</button>

  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/targets.mind;
      autoStart: false;
      uiLoading: yes;
      uiScanning: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img
        id="info"
        src="./assets/infographic.png">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Target ลำดับที่ 0 -->
    <a-entity id="target"
      mindar-image-target="targetIndex: 0">

      <!-- แสดง Infographic เมื่อพบ Target -->
      <a-plane
        src="#info"
        position="0 0 0"
        width="1"
        height="0.5625">
      </a-plane>

    </a-entity>
  </a-scene>

  <!-- เสียงพากย์ของคุณ -->
  <audio id="voice"
    src="./assets/voice.mp3"
    preload="auto">
  </audio>

  <script>
    const scene = document.querySelector("a-scene");
    const target = document.querySelector("#target");
    const voice = document.querySelector("#voice");
    const start = document.querySelector("#start");
    const status = document.querySelector("#status");

    let visible = false;

    // เริ่มเปิดกล้องหลังและระบบสแกน
    start.addEventListener("click", async () => {
      try {
        status.textContent = "กำลังเปิดกล้อง...";
        await scene.systems["mindar-image-system"].start();

        start.style.display = "none";
        status.textContent = "กำลังสแกนรูป Target";

      } catch (error) {
        console.error(error);
        status.textContent =
          "เปิดกล้องไม่ได้ กรุณาอนุญาตใช้กล้องและใช้ HTTPS";
      }
    });

    // เมื่อสแกนพบ Target
    target.addEventListener("targetFound", async () => {
      visible = true;
      status.textContent = "พบ Target แล้ว! กำลังเล่นเสียงพากย์";

      voice.currentTime = 0;

      try {
        await voice.play();
      } catch (error) {
        status.textContent =
          "พบ Target แล้ว แต่เสียงถูกบล็อก กรุณาแตะหน้าจอแล้วลองใหม่";
        console.error(error);
      }
    });

    // เมื่อกล้องตรวจไม่พบ Target
    target.addEventListener("targetLost", () => {
      visible = false;
      status.textContent = "ไม่พบ Target กรุณาสแกนใหม่";

      voice.pause();
      voice.currentTime = 0;
    });
  </script>
</body>
</html>
