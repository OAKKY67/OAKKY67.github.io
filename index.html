
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a-scene
    mindar-face="faceOccluder: false"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-entity
      id="face"
      mindar-face-default-face-occluder>
    </a-entity>

    <a-camera
      active="false"
      position="0 0 0">
    </a-camera>
  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");

    scene.addEventListener("arReady", () => {
      const THREE = AFRAME.THREE;

      // รูปที่อัปโหลดไว้ใน GitHub Repository
      const imageURL = "https://oakky67.github.io/face.png";

      const image = new Image();

      image.onload = () => {
        // สร้าง Canvas เพื่อทำพื้นหลังดำให้โปร่งใส
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;

        const ctx = canvas.getContext("2d", {
          willReadFrequently: true
        });

        ctx.drawImage(image, 0, 0);

        const imageData = ctx.getImageData(
          0, 0, canvas.width, canvas.height
        );

        const pixels = imageData.data;

        for (let i = 0; i < pixels.length; i += 4) {
          const r = pixels[i];
          const g = pixels[i + 1];
          const b = pixels[i + 2];

          // ใช้ค่าสีที่สว่างที่สุดแยกเส้นออกจากพื้นดำ
          const brightness = Math.max(r, g, b);

          if (brightness < 35) {
            pixels[i + 3] = 0;
          } else {
            // ทำขอบเส้นให้ค่อย ๆ โปร่งใส
            const alpha = Math.min(
              1,
              Math.max(0, (brightness - 35) / 100)
            );

            pixels[i + 3] = Math.round(
              pixels[i + 3] * alpha
            );
          }
        }

        ctx.putImageData(imageData, 0, 0);

        // สร้าง Texture จากภาพที่พื้นหลังโปร่งใสแล้ว
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.needsUpdate = true;

        const face = document.querySelector("#face");
        const mesh = face.getObject3D("mesh");

        if (!mesh) {
          console.error("ไม่พบ Face Mesh ของ MindAR");
          return;
        }

        // เปลี่ยนวัสดุของ Face Mesh ให้ใช้ภาพของเรา
        const oldMaterial = mesh.material;

        mesh.material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 1,
          side: THREE.DoubleSide,
          depthWrite: false
        });

        if (oldMaterial) {
          if (Array.isArray(oldMaterial)) {
            oldMaterial.forEach(m => m.dispose());
          } else {
            oldMaterial.dispose();
          }
        }

        mesh.frustumCulled = false;

        console.log("โหลด Face Texture สำเร็จ");
      };

      image.onerror = () => {
        console.error(
          "โหลดรูปไม่ได้ กรุณาตรวจสอบ URL face.png"
        );
      };

      image.src = imageURL;
    });

    scene.addEventListener("arError", (event) => {
      console.error("MindAR Error:", event);
    });
  </script>
</body>
</html>
