
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Infographic</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #111; }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 15px;
      border-radius: 12px;
      color: white;
      background: #263b55ee;
      text-align: center;
      line-height: 1.5;
    }

    #start {
      position: fixed;
      z-index: 20;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      border: 0;
      border-radius: 12px;
      background: orange;
      color: #111;
      font-size: 18px;
      font-weight: bold;
    }

    a-scene {
      position: fixed;
      inset: 0;
    }
  </style>
</head>

<body>
  <div id="status">กำลังตรวจสอบไฟล์...</div>
  <button id="start" disabled>กำลังโหลด...</button>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: yes;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="15000">
      <img id="info" src="./infographic.png">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane
        src="#info"
        position="0 0 0"
        width="1"
        height="0.5625">
      </a-plane>
    </a-entity>
  </a-scene>

  <audio id="voice" src="./voice.mp3" preload="auto"></audio>

  <script>
    const scene = document.querySelector("#scene");
    const statusBox = document.querySelector("#status");
    const startButton = document.querySelector("#start");
    const info = document.querySelector("#info");
    const voice = document.querySelector("#voice");
    const target = document.querySelector("#target");

    let started = false;
    let targetFound = false;

    function errorMessage(message) {
      statusBox.textContent = message;
      startButton.disabled = false;
      startButton.textContent = "โหลดใหม่";
      startButton.onclick = () => location.reload();
    }

    async function checkFile(url, label) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error("ไม่พบไฟล์ " + label + " (HTTP " + response.status + ")");
      }
    }

    async function initialize() {
      try {
        statusBox.textContent = "กำลังตรวจสอบไฟล์ Target และรูปภาพ...";

        await Promise.all([
          checkFile("./targets.mind", "targets.mind"),
          checkFile("./infographic.png", "infographic.png"),
          checkFile("./voice.mp3", "voice.mp3")
        ]);

        await new Promise((resolve, reject) => {
          if (info.complete && info.naturalWidth > 0) {
            resolve();
          } else {
            info.onload = resolve;
            info.onerror = () => reject(
              new Error("เปิด infographic.png ไม่ได้")
            );
          }
        });

        statusBox.textContent = "ไฟล์ครบแล้ว กดเริ่มสแกน AR";
        startButton.disabled = false;
        startButton.textContent = "เริ่มสแกน AR";
        startButton.onclick = startAR;

      } catch (error) {
        console.error(error);
        errorMessage("โหลดไฟล์ไม่สำเร็จ: " + error.message);
      }
    }

    async function startAR() {
      if (started) return;

      startButton.disabled = true;
      statusBox.textContent = "กำลังเปิดกล้องและโหลดระบบ AR...";

      try {
        const system = scene.systems["mindar-image-system"];
        if (!system) throw new Error("โหลด MindAR ไม่สำเร็จ");

        await system.start();
        started = true;
        startButton.style.display = "none";
        statusBox.textContent = "กำลังสแกนรูป Target";

        setTimeout(() => {
          if (started && !targetFound) {
            statusBox.textContent =
              "ยังไม่พบ Target: ส่องรูปต้นฉบับให้ชัดและเต็มกรอบ";
          }
        }, 15000);

      } catch (error) {
        console.error(error);
        started = false;
        errorMessage(
          "เปิดกล้องหรือระบบ AR ไม่สำเร็จ กรุณาอนุญาตกล้องและลองใหม่"
        );
      }
    }

    target.addEventListener("targetFound", async () => {
      targetFound = true;
      statusBox.textContent = "พบ Target แล้ว! กำลังเล่นเสียงบรรยาย";

      try {
        voice.currentTime = 0;
        await voice.play();
      } catch (error) {
        console.error(error);
        statusBox.textContent = "พบ Target แล้ว แต่เล่นเสียงไม่ได้";
      }
    });

    target.addEventListener("targetLost", () => {
      targetFound = false;
      statusBox.textContent = "ไม่พบ Target กรุณาส่องรูปอีกครั้ง";
      voice.pause();
      voice.currentTime = 0;
    });

    scene.addEventListener("arError", event => {
      console.error("MindAR error:", event);
      errorMessage("ระบบ AR เกิดข้อผิดพลาด กรุณารีเฟรชหน้าเว็บ");
    });

    initialize();
  </script>
</body>
</html>
