
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>AR Infographic</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 15px;
      border-radius: 12px;
      color: white;
      background: #263b55ee;
      text-align: center;
      line-height: 1.5;
    }

    #start, #soundButton {
      position: fixed;
      z-index: 20;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 24px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    #start {
      top: 50%;
      background: orange;
      color: #111;
    }

    #soundButton {
      bottom: 35px;
      display: none;
      background: #ffb52e;
      color: #111;
    }

    a-scene {
      position: fixed;
      inset: 0;
    }
  </style>
</head>

<body>
  <div id="status">กำลังตรวจสอบไฟล์ AR...</div>
  <button id="start" disabled>กำลังโหลด...</button>
  <button id="soundButton">▶ เปิดเสียงบรรยาย</button>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: yes;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="15000">
      <img id="info" src="./infographic.png">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane
        src="#info"
        position="0 0 0"
        width="1"
        height="0.5625">
      </a-plane>
    </a-entity>
  </a-scene>

  <audio
    id="voice"
    src="./voice.mp3"
    preload="auto"
    playsinline>
  </audio>

  <script>
    const scene = document.querySelector("#scene");
    const statusBox = document.querySelector("#status");
    const startButton = document.querySelector("#start");
    const soundButton = document.querySelector("#soundButton");
    const info = document.querySelector("#info");
    const voice = document.querySelector("#voice");
    const target = document.querySelector("#target");

    let started = false;
    let targetFound = false;

    function showError(message) {
      statusBox.textContent = message;
      startButton.disabled = false;
      startButton.textContent = "โหลดใหม่";
      startButton.onclick = () => location.reload();
    }

    async function checkFile(url, name) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error("ไม่พบไฟล์ " + name + " (HTTP " + response.status + ")");
      }
    }

    async function initialize() {
      try {
        statusBox.textContent = "กำลังตรวจสอบไฟล์...";

        await Promise.all([
          checkFile("./targets.mind", "targets.mind"),
          checkFile("./infographic.png", "infographic.png"),
          checkFile("./voice.mp3", "voice.mp3")
        ]);

        if (!info.complete || info.naturalWidth === 0) {
          await new Promise((resolve, reject) => {
            info.onload = resolve;
            info.onerror = () => reject(
              new Error("โหลด infographic.png ไม่สำเร็จ")
            );
          });
        }

        statusBox.textContent = "ไฟล์พร้อมแล้ว กดเริ่มสแกน AR";
        startButton.disabled = false;
        startButton.textContent = "เริ่มสแกน AR";
        startButton.onclick = startAR;

      } catch (error) {
        console.error(error);
        showError("โหลดไฟล์ไม่สำเร็จ: " + error.message);
      }
    }

    async function startAR() {
      if (started) return;

      startButton.disabled = true;
      statusBox.textContent = "กำลังเปิดกล้องและเริ่ม AR...";

      try {
        const system = scene.systems["mindar-image-system"];
        if (!system) throw new Error("โหลดระบบ MindAR ไม่สำเร็จ");

        await system.start();
        started = true;
        startButton.style.display = "none";
        statusBox.textContent = "กำลังสแกนรูป Target";

      } catch (error) {
        console.error(error);
        started = false;
        showError("เปิด AR ไม่สำเร็จ กรุณาอนุญาตกล้องแล้วลองใหม่");
      }
    }

    async function playVoice() {
      try {
        voice.muted = false;
        voice.volume = 1;
        await voice.play();

        soundButton.textContent = "▶ เล่นเสียงบรรยายอีกครั้ง";
        statusBox.textContent = "พบ Target แล้ว กำลังเล่นเสียงบรรยาย";
      } catch (error) {
        console.error("Audio error:", error);

        soundButton.style.display = "block";
        statusBox.textContent =
          "พบ Target แล้ว แต่เสียงไม่เริ่มอัตโนมัติ กดปุ่มเปิดเสียงด้านล่าง";
      }
    }

    soundButton.addEventListener("click", async () => {
      if (!targetFound) {
        statusBox.textContent = "กรุณาส่องรูป Target ให้ระบบตรวจจับก่อน";
        return;
      }

      voice.currentTime = 0;
      await playVoice();
    });

    target.addEventListener("targetFound", () => {
      targetFound = true;
      soundButton.style.display = "block";
      voice.currentTime = 0;
      playVoice();
    });

    target.addEventListener("targetLost", () => {
      targetFound = false;
      voice.pause();
      voice.currentTime = 0;
      soundButton.style.display = "none";
      statusBox.textContent = "ไม่พบ Target กรุณาส่องรูปอีกครั้ง";
    });

    voice.addEventListener("ended", () => {
      if (targetFound) {
        soundButton.textContent = "▶ เล่นเสียงบรรยายอีกครั้ง";
      }
    });

    voice.addEventListener("error", () => {
      console.error("โหลดเสียงไม่สำเร็จ", voice.error);
      statusBox.textContent =
        "พบ Target แล้ว แต่โหลดเสียงไม่ได้ ตรวจสอบไฟล์ voice.mp3";
      soundButton.style.display = "block";
    });

    scene.addEventListener("arError", event => {
      console.error("MindAR error:", event);
      showError("ระบบ AR เกิดข้อผิดพลาด กรุณารีเฟรชหน้าเว็บ");
    });

    initialize();
  </script>
</body>
</html>
