
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Avatar Face Tracking</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 0;
    }

    #three-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 5;
      padding: 12px 15px;
      color: white;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      max-width: 300px;
    }

    #status {
      overflow-wrap: anywhere;
      color: #b8ffb8;
    }

    #startButton {
      margin-top: 8px;
      padding: 10px 14px;
      border: 0;
      border-radius: 7px;
      background: #4caf50;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="three-canvas"></canvas>

  <div id="panel">
    <strong>3D Avatar Face Tracking</strong>
    <div id="status">กดปุ่มเพื่อเริ่มต้น</div>
    <button id="startButton">เปิดกล้อง</button>
    <div>กระพริบตา · อ้าปาก · ยิ้ม · หันหัว</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    // =========================================
    // 1. ตั้งค่าฉาก
    // =========================================

    const video = document.getElementById("video");
    const canvas = document.getElementById("three-canvas");
    const statusText = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    const scene = new THREE.Scene();

    const camera = new THREE.OrthographicCamera(
      -1, 1, 1, -1, 0.01, 100
    );

    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2));

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(0, 3, 5);
    scene.add(light);

    let faceLandmarker = null;
    let avatar = null;
    let modelScene = null;
    let modelWidth = 1;
    let morphTargets = [];

    let lastVideoTime = -1;
    let trackingStarted = false;

    // =========================================
    // 2. ปรับความไวของระบบได้ตรงนี้
    // =========================================

    const SETTINGS = {
      yawStrength: 1.5,      // หันซ้าย-ขวา
      pitchStrength: 1.6,    // ก้ม-เงย
      rollStrength: 1.0,     // เอียงหัว
      smoothness: 0.18,      // ความลื่นไหล
      headSize: 2.5,         // ขนาดโมเดล
      verticalOffset: -0.10  // ตำแหน่งขึ้น-ลง
    };

    const tracking = {
      x: 0,
      y: 0,
      scale: 1,
      yaw: 0,
      pitch: 0,
      roll: 0
    };

    const target = {
      x: 0,
      y: 0,
      scale: 1,
      yaw: 0,
      pitch: 0,
      roll: 0
    };

    // =========================================
    // 3. โหลด robot_head6.glb
    // =========================================

    async function loadAvatar() {
      statusText.textContent = "กำลังโหลด robot_head6.glb...";

      const loader = new GLTFLoader();

      // ไฟล์ GLB ต้องอยู่ในโฟลเดอร์เดียวกับ HTML
      const gltf = await loader.loadAsync("./robot_head6.glb");

      modelScene = gltf.scene;
      modelScene.updateMatrixWorld(true);

      // หาจุดกึ่งกลางและขนาดของโมเดล
      const bounds = new THREE.Box3().setFromObject(modelScene);
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();

      bounds.getCenter(center);
      bounds.getSize(size);

      modelWidth = Math.max(size.x, 0.001);

      // จัดโมเดลให้อยู่กึ่งกลาง Group
      modelScene.position.sub(center);

      avatar = new THREE.Group();
      avatar.add(modelScene);
      scene.add(avatar);

      // เก็บ Shape Keys จากทุก Mesh
      morphTargets = [];

      modelScene.traverse((object) => {
        if (
          object.isMesh &&
          object.morphTargetDictionary &&
          object.morphTargetInfluences
        ) {
          morphTargets.push({
            name: object.name,
            dictionary: object.morphTargetDictionary,
            influences: object.morphTargetInfluences
          });
        }
      });

      console.log("Shape Keys ที่พบในโมเดล:");

      for (const mesh of morphTargets) {
        console.log(mesh.name, Object.keys(mesh.dictionary));
      }

      // ตั้งค่าทุก Shape Key ให้เริ่มต้นที่ 0
      for (const mesh of morphTargets) {
        for (let i = 0; i < mesh.influences.length; i++) {
          mesh.influences[i] = 0;
        }
      }

      statusText.textContent = "โหลดโมเดลสำเร็จ";
    }

    // =========================================
    // 4. เปิด MediaPipe Face Landmarker
    // =========================================

    async function setupFaceTracking() {
      statusText.textContent = "กำลังโหลดระบบตรวจจับใบหน้า...";

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: true,
          outputFacialTransformationMatrixes: true
        }
      );
    }

    // =========================================
    // 5. เปิดกล้องเว็บแคม
    // =========================================

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;

      await new Promise((resolve, reject) => {
        video.onloadedmetadata = resolve;
        video.onerror = reject;
      });

      await video.play();
    }

    // =========================================
    // 6. แปลงตำแหน่งใบหน้าให้ตรงกับภาพกล้อง
    // =========================================

    function getScreenPoint(point) {
      const videoAspect = video.videoWidth / video.videoHeight;
      const screenAspect = window.innerWidth / window.innerHeight;

      let x = point.x;
      let y = point.y;

      // ชดเชยการครอปภาพของ object-fit: cover
      if (videoAspect > screenAspect) {
        const visibleWidth = screenAspect / videoAspect;
        x = (x - (1 - visibleWidth) / 2) / visibleWidth;
      } else {
        const visibleHeight = videoAspect / screenAspect;
        y = (y - (1 - visibleHeight) / 2) / visibleHeight;
      }

      // กล้องแสดงผลแบบกลับซ้าย-ขวา
      x = 1 - x;

      return {
        x: (x - 0.5) * 2 * screenAspect,
        y: (0.5 - y) * 2
      };
    }

    // =========================================
    // 7. ตรวจจับตำแหน่งและการหมุนหัว
    // =========================================

    function updateHead(landmarks) {
      if (!landmarks || !avatar) return;

      const nose = landmarks[1];
      const leftEye = landmarks[33];
      const rightEye = landmarks[263];
      const forehead = landmarks[10];
      const chin = landmarks[152];

      const eyeCenter = {
        x: (leftEye.x + rightEye.x) / 2,
        y: (leftEye.y + rightEye.y) / 2
      };

      // ตำแหน่งหัวบนหน้าจอ
      const screenPoint = getScreenPoint(eyeCenter);

      target.x = screenPoint.x;
      target.y = screenPoint.y + SETTINGS.verticalOffset;

      // ปรับขนาดจากระยะห่างระหว่างดวงตา
      const dx = rightEye.x - leftEye.x;
      const dy = rightEye.y - leftEye.y;
      const eyeDistance = Math.sqrt(dx * dx + dy * dy);

      target.scale = Math.max(
        (eyeDistance * 2 * SETTINGS.headSize) / modelWidth,
        0.001
      );

      // หันซ้าย-ขวาโดยประมาณจากตำแหน่งจมูก
      const eyeWidth = Math.max(
        Math.sqrt(dx * dx + dy * dy),
        0.001
      );

      const noseOffset = (nose.x - eyeCenter.x) / eyeWidth;

      target.yaw = THREE.MathUtils.clamp(
        -noseOffset * SETTINGS.yawStrength,
        -0.8,
        0.8
      );

      // ก้ม-เงยโดยประมาณจากตำแหน่งจมูก
      const faceHeight = Math.max(chin.y - forehead.y, 0.001);
      const noseRelativeY = (nose.y - forehead.y) / faceHeight;

      target.pitch = THREE.MathUtils.clamp(
        (noseRelativeY - 0.48) * SETTINGS.pitchStrength,
        -0.6,
        0.6
      );

      // เอียงหัวจากแนวตา
      const eyeAngle = Math.atan2(
        rightEye.y - leftEye.y,
        rightEye.x - leftEye.x
      );

      target.roll = THREE.MathUtils.clamp(
        -eyeAngle * SETTINGS.rollStrength,
        -0.7,
        0.7
      );
    }

    // =========================================
    // 8. ควบคุม Shape Keys
    // =========================================

    function setMorph(name, value) {
      const amount = THREE.MathUtils.clamp(value, 0, 1);

      for (const mesh of morphTargets) {
        const index = mesh.dictionary[name];

        if (index !== undefined) {
          mesh.influences[index] = amount;
        }
      }
    }

    function updateBlendshapes(results) {
      if (
        !results.faceBlendshapes ||
        results.faceBlendshapes.length === 0
      ) {
        return;
      }

      const categories = results.faceBlendshapes[0].categories;
      const scores = {};

      for (const category of categories) {
        scores[category.categoryName] = category.score;
      }

      // กระพริบตา
      setMorph("eyeBlinkLeft", scores.eyeBlinkLeft || 0);
      setMorph("eyeBlinkRight", scores.eyeBlinkRight || 0);

      // อ้าปาก
      setMorph("jawOpen", scores.jawOpen || 0);

      // ยิ้มซ้าย-ขวา
      setMorph("mouthSmileLeft", scores.mouthSmileLeft || 0);
      setMorph("mouthSmileRight", scores.mouthSmileRight || 0);

      // ทำหน้าบึ้งซ้าย-ขวา
      setMorph("mouthFrownLeft", scores.mouthFrownLeft || 0);
      setMorph("mouthFrownRight", scores.mouthFrownRight || 0);

      // ขยับสายตาเข้าด้านใน
      setMorph("eyeLookInLeft", scores.eyeLookInLeft || 0);
      setMorph("eyeLookInRight", scores.eyeLookInRight || 0);
    }

    // =========================================
    // 9. ตรวจจับใบหน้าทุกเฟรม
    // =========================================

    function detectFace() {
      if (!trackingStarted) return;

      if (
        faceLandmarker &&
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
      ) {
        lastVideoTime = video.currentTime;

        try {
          const results = faceLandmarker.detectForVideo(
            video,
            performance.now()
          );

          if (
            results.faceLandmarks &&
            results.faceLandmarks.length > 0
          ) {
            updateHead(results.faceLandmarks[0]);
            updateBlendshapes(results);

            statusText.textContent = "ตรวจพบใบหน้าแล้ว ✓";
          } else {
            statusText.textContent = "ไม่พบใบหน้า";
          }
        } catch (error) {
          console.error("Face tracking error:", error);
          statusText.textContent = "เกิดข้อผิดพลาดในการตรวจจับ";
        }
      }

      requestAnimationFrame(detectFace);
    }

    // =========================================
    // 10. แสดงโมเดลและทำให้การเคลื่อนไหวลื่นไหล
    // =========================================

    function animate() {
      requestAnimationFrame(animate);

      if (avatar) {
        const smooth = SETTINGS.smoothness;

        tracking.x += (target.x - tracking.x) * smooth;
        tracking.y += (target.y - tracking.y) * smooth;
        tracking.scale += (target.scale - tracking.scale) * smooth;

        tracking.yaw += (target.yaw - tracking.yaw) * smooth;
        tracking.pitch += (target.pitch - tracking.pitch) * smooth;
        tracking.roll += (target.roll - tracking.roll) * smooth;

        avatar.position.x = tracking.x;
        avatar.position.y = tracking.y;

        avatar.scale.setScalar(Math.max(tracking.scale, 0.001));

        // หมุนหัวตามค่าที่อ่านได้
        avatar.rotation.order = "YXZ";
        avatar.rotation.y = tracking.yaw;
        avatar.rotation.x = tracking.pitch;
        avatar.rotation.z = tracking.roll;
      }

      renderer.render(scene, camera);
    }

    // =========================================
    // 11. ปรับหน้าจอเมื่อเปลี่ยนขนาด
    // =========================================

    function resize() {
      const aspect = window.innerWidth / window.innerHeight;

      camera.left = -aspect;
      camera.right = aspect;
      camera.top = 1;
      camera.bottom = -1;

      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);
    resize();

    // =========================================
    // 12. เริ่มใช้งาน
    // =========================================

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      statusText.textContent = "กำลังเริ่มต้นระบบ...";

      try {
        await startCamera();
        await loadAvatar();
        await setupFaceTracking();

        trackingStarted = true;
        startButton.style.display = "none";

        statusText.textContent = "กำลังติดตามใบหน้า...";
        detectFace();
      } catch (error) {
        console.error(error);

        statusText.textContent =
          "เริ่มระบบไม่สำเร็จ: " + error.message;

        startButton.disabled = false;
      }
    });

    animate();
  </script>
</body>
</html>
