```html
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Head AR Face Tracking</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }

    /* ภาพกล้องเต็มหน้าจอ */
    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 0;
    }

    /* Canvas โมเดลอยู่เหนือภาพกล้อง */
    #container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      padding: 10px 12px;
      color: white;
      background: #000a;
      border-radius: 8px;
      font-size: 13px;
    }

    #startButton {
      position: fixed;
      z-index: 10;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <video id="camera" autoplay playsinline muted></video>
  <div id="container"></div>
  <div id="status">กดเปิดกล้องเพื่อเริ่มต้น</div>
  <button id="startButton">เปิดกล้อง</button>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    import {
      FaceLandmarker,
      FilesetResolver
    } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';

    const video = document.querySelector('#camera');
    const status = document.querySelector('#status');
    const startButton = document.querySelector('#startButton');
    const container = document.querySelector('#container');

    let landmarker;
    let model;
    let meshes = [];
    let lastVideoTime = -1;
    let faceFound = false;
    let modelWidth = 1;
    let smoothedX = 0;
    let smoothedY = 0;
    let smoothedScale = 1;

    // ฉากโปร่งใสสำหรับวางโมเดลทับกล้อง
    const scene = new THREE.Scene();

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);

    container.appendChild(renderer.domElement);

    // กล้อง Orthographic ใช้พิกัดที่วางตามตำแหน่งหน้าจอได้ง่าย
    const aspect = window.innerWidth / window.innerHeight;

    const camera3D = new THREE.OrthographicCamera(
      -aspect, aspect, 1, -1, 0.01, 100
    );

    camera3D.position.z = 10;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777788, 2));

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(0, 2, 5);
    scene.add(light);

    function setShape(name, value) {
      for (const mesh of meshes) {
        const index = mesh.morphTargetDictionary?.[name];

        if (index !== undefined) {
          mesh.morphTargetInfluences[index] = value;
        }
      }
    }

    async function start() {
      try {
        startButton.disabled = true;
        status.textContent = 'กำลังเปิดกล้อง...';

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        video.srcObject = stream;
        await video.play();

        status.textContent = 'กำลังโหลดโมเดล...';

        const gltf = await new GLTFLoader().loadAsync(
          './robot_head4.glb'
        );

        model = gltf.scene;
        scene.add(model);

        model.traverse(object => {
          if (
            object.isMesh &&
            object.morphTargetDictionary &&
            object.morphTargetInfluences
          ) {
            meshes.push(object);
            console.log('Shape Keys:', object.morphTargetDictionary);
          }
        });

        // หาขนาดจริงของโมเดล เพื่อคำนวณขนาดให้สัมพันธ์กับใบหน้า
        model.updateMatrixWorld(true);

        const bounds = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        bounds.getSize(size);

        modelWidth = Math.max(size.x, 0.001);

        // ตั้งจุดหมุนไว้กลางโมเดล
        const center = new THREE.Vector3();
        bounds.getCenter(center);

        for (const child of [...model.children]) {
          model.remove(child);
        }

        // วิธีนี้ใช้ group ครอบโมเดลเพื่อเลื่อนจุดกึ่งกลางไปที่ origin
        // โหลดโมเดลใหม่อีกครั้งเพื่อรักษาโครงสร้างภายในไว้
        const secondGLTF = await new GLTFLoader().loadAsync(
          './robot_head4.glb'
        );

        scene.remove(model);
        model = new THREE.Group();

        const innerModel = secondGLTF.scene;
        innerModel.position.sub(center);
        model.add(innerModel);
        scene.add(model);

        meshes = [];
        innerModel.traverse(object => {
          if (
            object.isMesh &&
            object.morphTargetDictionary &&
            object.morphTargetInfluences
          ) {
            meshes.push(object);
          }
        });

        status.textContent = 'กำลังเตรียมระบบติดตามใบหน้า...';

        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
        );

        landmarker = await FaceLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
              delegate: 'GPU'
            },
            runningMode: 'VIDEO',
            numFaces: 1,
            outputFaceBlendshapes: true
          }
        );

        status.textContent = 'หันหน้าเข้ากล้อง';

        startButton.style.display = 'none';
        animate();

      } catch (error) {
        console.error(error);
        status.textContent = 'เกิดข้อผิดพลาด: ' + error.message;
        startButton.disabled = false;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (
        landmarker &&
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
      ) {
        lastVideoTime = video.currentTime;

        const result = landmarker.detectForVideo(
          video,
          performance.now()
        );

        const landmarks = result.faceLandmarks?.[0];

        if (landmarks) {
          faceFound = true;

          // จุดกึ่งกลางระหว่างดวงตาทั้งสอง
          const leftEye = landmarks[33];
          const rightEye = landmarks[263];

          const centerX = (leftEye.x + rightEye.x) / 2;
          const centerY = (leftEye.y + rightEye.y) / 2;

          // ระยะห่างระหว่างตาใช้คำนวณขนาดโมเดล
          const dx = leftEye.x - rightEye.x;
          const dy = leftEye.y - rightEye.y;
          const eyeDistance = Math.sqrt(dx * dx + dy * dy);

          const aspect = window.innerWidth / window.innerHeight;

          // กล้องถูกกลับซ้าย-ขวา จึงกลับค่า X ให้ตรงกัน
          const targetX = (centerX - 0.5) * 2 * aspect;
          const targetY = (0.5 - centerY) * 2;

          // ค่า 2.5 คือขนาดเริ่มต้น ปรับเพิ่มหรือลดได้
          const targetScale =
            Math.max(0.01, eyeDistance * 2 * 2.5);

          // ทำให้การเคลื่อนที่นุ่มนวล
          smoothedX += (targetX - smoothedX) * 0.35;
          smoothedY += (targetY - smoothedY) * 0.35;
          smoothedScale += (targetScale - smoothedScale) * 0.25;

          model.position.set(smoothedX, smoothedY, 0);
          model.scale.setScalar(
            smoothedScale / modelWidth
          );

          const categories =
            result.faceBlendshapes?.[0]?.categories ?? [];

          const values = {};

          for (const item of categories) {
            values[item.categoryName] = item.score;
          }

          setShape(
            'eyeBlinkLeft',
            Math.min(1, (values.eyeBlinkLeft ?? 0) * 1.5)
          );

          setShape(
            'eyeBlinkRight',
            Math.min(1, (values.eyeBlinkRight ?? 0) * 1.5)
          );

          setShape('mouthOpen', values.jawOpen ?? 0);

          setShape(
            'smile',
            Math.max(
              values.mouthSmileLeft ?? 0,
              values.mouthSmileRight ?? 0
            )
          );

          setShape(
            'frown',
            Math.max(
              values.browDownLeft ?? 0,
              values.browDownRight ?? 0
            )
          );

          status.textContent = 'กำลังติดตามใบหน้า';
        } else {
          faceFound = false;
          status.textContent = 'ไม่พบใบหน้า';
        }
      }

      // ซ่อนโมเดลเมื่อไม่พบใบหน้า
      if (model) {
        model.visible = faceFound;
      }

      renderer.render(scene, camera3D);
    }

    startButton.addEventListener('click', start);

    window.addEventListener('resize', () => {
      const aspect = window.innerWidth / window.innerHeight;

      camera3D.left = -aspect;
      camera3D.right = aspect;
      camera3D.top = 1;
      camera3D.bottom = -1;
      camera3D.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
