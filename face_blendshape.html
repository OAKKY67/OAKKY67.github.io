<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Head Face Tracking</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    #container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #controls {
      position: fixed;
      z-index: 10;
      top: 10px;
      left: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <div id="controls">
    <button id="blink">ทดสอบกระพริบตา</button>
    <button id="reset">คืนค่าดวงตา</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-face-three';

    const mindar = new MindARThree({
      container: document.querySelector('#container')
    });

    const { renderer, scene, camera } = mindar;

    scene.add(
      new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2)
    );

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(0, 1, 2);
    scene.add(light);

    const gltf = await new GLTFLoader().loadAsync(
      './robot_head4.glb'
    );

    const model = gltf.scene;
    model.scale.setScalar(2);

    const anchor = mindar.addAnchor(1);
    anchor.group.add(model);

    const meshes = [];

    model.traverse(object => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        meshes.push(object);

        console.log(
          'Mesh:', object.name,
          'Shape Keys:', object.morphTargetDictionary
        );
      }
    });

    function setShape(name, value) {
      let found = false;

      for (const mesh of meshes) {
        const index = mesh.morphTargetDictionary[name];

        if (index !== undefined) {
          mesh.morphTargetInfluences[index] = value;
          found = true;
        }
      }

      console.log(name, found ? value : 'ไม่พบ Shape Key');
    }

    document.querySelector('#blink').onclick = () => {
      setShape('eyeBlinkLeft', 1);
      setShape('eyeBlinkRight', 1);
    };

    document.querySelector('#reset').onclick = () => {
      setShape('eyeBlinkLeft', 0);
      setShape('eyeBlinkRight', 0);
    };

    await mindar.start();

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
