<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Face Tracking</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR Face Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #title {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;

      color: white;
      background: rgba(0, 0, 0, 0.65);

      padding: 8px 16px;
      border-radius: 20px;

      font-family: Arial, sans-serif;
      font-size: 14px;

      pointer-events: none;
    }
  </style>
</head>


<body>

  <!-- ข้อความด้านบน -->
  <div id="title">
    Face Tracking - Hat & Glasses
  </div>


  <a-scene

    mindar-face="autoStart: true"

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- ================================= -->
    <!-- โหลดโมเดล 3D -->
    <!-- ================================= -->

    <a-assets>

      <!-- แว่น -->
      <a-asset-item
        id="glassesModel"
        src="./glasses.glb">
      </a-asset-item>


      <!-- หมวก -->
      <a-asset-item
        id="hatModel"
        src="./hat.glb">
      </a-asset-item>

    </a-assets>



    <!-- ================================= -->
    <!-- CAMERA -->
    <!-- ================================= -->

    <a-camera
      active="false"
      position="0 0 0">
    </a-camera>



    <!-- ================================= -->
    <!-- GLASSES -->
    <!-- ================================= -->

    <a-entity
      mindar-face-target="anchorIndex: 168">

      <a-gltf-model
        src="#glassesModel"

        position="0 0 0"

        rotation="0 0 0"

        scale="0.50 0.50 0.50">
      </a-gltf-model>

    </a-entity>



    <!-- ================================= -->
    <!-- HAT -->
    <!-- ================================= -->

    <a-entity
      mindar-face-target="anchorIndex: 10">

      <a-gltf-model
        src="#hatModel"

        position="0 0.45 0"

        rotation="0 0 0"

        scale="1 1 1">
      </a-gltf-model>

    </a-entity>



    <!-- ================================= -->
    <!-- LIGHT -->
    <!-- ================================= -->

    <a-light
      type="ambient"
      intensity="1.5">
    </a-light>


    <a-light
      type="directional"
      position="0 1 1"
      intensity="1">
    </a-light>


  </a-scene>

</body>

</html>
