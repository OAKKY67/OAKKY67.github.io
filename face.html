<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-face
  embedded
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- โมเดล -->
  <a-assets>

    <!-- แว่น -->
    <a-asset-item
      id="glassesModel"
      src="./glasses.glb">
    </a-asset-item>

    <!-- หมวก -->
    <a-asset-item
      id="hatModel"
      src="./hat.glb">
    </a-asset-item>

  </a-assets>


  <!-- กล้อง -->
  <a-camera
    active="false"
    position="0 0 0">
  </a-camera>


  <!-- ========================= -->
  <!-- แว่น -->
  <!-- ========================= -->

  <a-entity
    mindar-face-target="anchorIndex: 168">

    <a-gltf-model
      src="#glassesModel"
      rotation="0 0 0"
      position="0 0 0"
      scale="0.5 0.5 0.5">
    </a-gltf-model>

  </a-entity>


  <!-- ========================= -->
  <!-- หมวก -->
  <!-- ========================= -->

  <a-entity
    mindar-face-target="anchorIndex: 10">

    <a-gltf-model
      src="#hatModel"
      rotation="0 0 0"
      position="0 0.2 -0.3"
      scale="0.35 0.35 0.35">
    </a-gltf-model>

  </a-entity>


</a-scene>

</body>
</html>
